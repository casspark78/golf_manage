<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>학수의 Golf</title>
<meta name="description" content="라운드 일정 관리, 스코어 기록, 통계를 한번에 - 학수의 Golf">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2DC96E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="학수의 Golf">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="app-title"><span class="logo-dot"></span>학수의 Golf</div>
    <div class="header-actions">
      <button class="icon-btn" id="theme-toggle-btn" aria-label="테마 전환" title="다크/라이트 모드">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
      <button class="icon-btn" id="settings-btn" aria-label="설정" title="설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section class="view" id="view-home"></section>
    <section class="view" id="view-schedule"></section>
    <section class="view" id="view-score"></section>
    <section class="view" id="view-stats"></section>
  </main>

  <nav class="tab-bar">
    <div class="tab-bar-inner">
      <button class="tab-btn" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span>홈</span>
      </button>
      <button class="tab-btn" data-tab="schedule">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
        <span>일정</span>
      </button>
      <button class="tab-btn" data-tab="score">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
        <span>스코어</span>
      </button>
      <button class="tab-btn" data-tab="stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
        <span>통계</span>
      </button>
    </div>
  </nav>

  <!-- Schedule Add/Edit Modal -->
  <div class="modal-overlay" id="schedule-modal-overlay">
    <div class="modal-sheet" id="schedule-modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">
        <span id="schedule-modal-title">일정 추가</span>
        <button class="icon-btn" id="schedule-modal-close" aria-label="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="schedule-modal-body"></div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal-overlay">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title">
        <span>설정</span>
        <button class="icon-btn" id="settings-modal-close" aria-label="닫기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="settings-modal-body"></div>
    </div>
  </div>

  <!-- Score Entry Fullscreen Modal -->
  <div class="fullscreen-modal" id="score-entry-overlay">
    <div class="score-entry-navbar">
      <button class="nav-text-btn" id="score-entry-close">취소</button>
      <div class="score-entry-title" id="score-entry-title">골프장</div>
      <div class="score-entry-navbar-right">
        <button class="icon-btn-plain" id="score-entry-scan-btn" aria-label="스코어카드 스캔">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
        <button class="nav-text-btn" id="score-entry-save">저장</button>
      </div>
    </div>
    <div class="score-entry-body" id="score-entry-body"></div>
    <input type="file" accept="image/*" capture="environment" id="score-entry-file-input" class="hidden">
  </div>

</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
